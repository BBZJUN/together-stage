name: 올림픽공원 보행로(OSM) 수집

on:
  push:
    paths: ["pipeline/osm_query.overpassql"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overpass 요청
        run: |
          mkdir -p pipeline/samples
          ok=0
          for attempt in 1 2 3; do
            for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do
              code=$(curl -s -m 200 -o pipeline/samples/osm_olpark.json -w "%{http_code}" "$url" --data-urlencode "data@pipeline/osm_query.overpassql" || echo 000)
              echo "$url -> $code"
              if [ "$code" = "200" ] && python3 -c "import json;json.load(open('pipeline/samples/osm_olpark.json'))" 2>/dev/null; then ok=1; break 2; fi
              head -c 300 pipeline/samples/osm_olpark.json 2>/dev/null; echo
            done
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1
          ls -la pipeline/samples/
          python3 -c "import json;d=json.load(open('pipeline/samples/osm_olpark.json'));print(len(d['elements']))"
      - name: 커밋
        run: |
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          git add pipeline/samples/osm_olpark.json
          git diff --cached --quiet || git commit -m "data: 올림픽공원 OSM 보행로 갱신"
          git push
