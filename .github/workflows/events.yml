name: 올림픽공원 공식 공연 일정 수집

on:
  schedule:
    - cron: "41 20 * * *" # 매일 05:41 KST
  push:
    paths: ["pipeline/fetch_events.py", ".github/workflows/events.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 일정 수집
        run: python3 pipeline/fetch_events.py
      - name: 커밋
        run: |
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          git add src/data/events.json pipeline/raw_events
          git diff --cached --quiet && exit 0
          git commit -m "data: 올림픽공원 공연 일정 갱신"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
