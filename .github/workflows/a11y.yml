name: 접근성 자동 점검 (WCAG 2.1 AA)

on:
  push:
    paths: ["src/**", "public/**", "scripts/a11y.mjs", ".github/workflows/a11y.yml"]
  workflow_dispatch:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: 서버 실행 후 점검
        run: |
          npx next start -p 3000 &
          npx -y wait-on http://localhost:3000 -t 60000
          node scripts/a11y.mjs
